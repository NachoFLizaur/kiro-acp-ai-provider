name: Bug report
description: Report a problem with kiro-acp-ai-provider
labels: ["bug"]
assignees:
  - NachoFLizaur
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Environment"

  - type: input
    id: package-version
    attributes:
      label: kiro-acp-ai-provider version
      placeholder: e.g. 2.1.2
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      description: Node or Bun, with version
      placeholder: e.g. Bun 1.1.30, or Node 20.11.0
    validations:
      required: true

  - type: input
    id: kiro-cli-version
    attributes:
      label: kiro-cli version
      description: Output of `kiro-cli --version`
      placeholder: e.g. 2.2.3
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / platform
      placeholder: e.g. macOS 15.1 (arm64), Ubuntu 22.04, Windows 11
    validations:
      required: true
